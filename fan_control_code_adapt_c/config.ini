# 气浮台控制系统配置文件
# 模块化架构版本

# ============ 串口配置 ============
# 主串口设备路径
serial_port = /dev/ttyACM0
# 串口波特率
serial_baudrate = 115200
# IMU串口设备路径
imu_serial_port = /dev/ttyUSB0

# ============ MQTT配置 ============
# MQTT服务器地址
mqtt_server_address = tcp://192.168.31.4:1883
# MQTT客户端ID
mqtt_client_id = fan_control_client
# MQTT服务质量 (0-2)
mqtt_qos = 1

# ============ 动捕配置 ============
# 动捕服务器IP地址
mocap_ip = 192.168.31.3
# 动捕目标名称
mocap_target_name = WUZHOUSHANG

# ============ 控制参数 ============
# 控制循环周期 (毫秒)
control_loop_period_ms = 20
# MQTT发送间隔 (循环次数)
mqtt_send_interval = 5

# ============ 调平参数 ============
# 丝杆Z轴初始位置
lead_screw_z_init_pos = 3000

# ============ 姿态控制容差 ============
# 姿态角容差 (度)
angle_tolerance_deg = 1.0
# 偏航角容差 (度)
yaw_tolerance_deg = 3.0

# ============ PID参数 (示例) ============
# 角度环PID (roll, pitch, yaw)
#angle_pid_kp = 0.1,0.1,0.05
#angle_pid_ki = 0.01,0.01,0.005
#angle_pid_kd = 0.05,0.05,0.02

# 速度环PID (roll, pitch, yaw)
#velocity_pid_kp = 0.2,0.2,0.1
#velocity_pid_ki = 0.02,0.02,0.01
#velocity_pid_kd = 0.08,0.08,0.04

# ============ 日志配置 ============
# 启用日志记录
enable_logging = true
# 日志文件路径
log_file_path = attitude_compare.csv

# ============ 安全限制 ============
# 最大角速度限制 (deg/s)
max_angular_velocity = 100.0
# 最大姿态角限制 (deg)
max_attitude_angle = 30.0
# 紧急停止超时 (秒)
emergency_stop_timeout = 5.0